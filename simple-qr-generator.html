<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code Simplificado</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --panel-bg: rgba(30, 41, 59, 0.7);
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 800px;
      box-shadow: var(--glass-shadow);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 30px 20px;
        gap: 30px;
      }
    }

    .config-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #a5b4fc, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .form-control::placeholder {
      color: #475569;
    }

    .custom-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .color-pickers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      height: 48px;
    }

    .color-input-wrapper input[type="color"] {
      border: none;
      background: none;
      width: 32px;
      height: 32px;
      cursor: pointer;
      border-radius: 6px;
      margin-right: 10px;
    }

    .color-input-wrapper span {
      font-size: 13px;
      font-weight: 500;
    }

    .select-control {
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%2394a3b8' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 40px;
    }

    .preview-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      padding: 30px;
    }

    .qrcode-container-outer {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }

    .qrcode-container-outer:hover {
      transform: scale(1.02);
    }

    #qrcode img, #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Configuration panel -->
    <div class="config-side">
      <h1>Gerador de QR Code</h1>
      <p class="subtitle">Insira um endereço e personalize o seu QR Code</p>

      <div class="form-group">
        <label for="addressInput">Endereço / Link / Texto</label>
        <input type="text" id="addressInput" class="form-control" placeholder="https://exemplo.com" value="https://menu.hotelcentralparque.com.br/">
      </div>

      <div class="form-group">
        <label>Personalização de Cores</label>
        <div class="color-pickers">
          <div class="color-input-wrapper">
            <input type="color" id="colorDark" value="#0f172a">
            <span>QR Code</span>
          </div>
          <div class="color-input-wrapper">
            <input type="color" id="colorLight" value="#ffffff">
            <span>Fundo</span>
          </div>
        </div>
      </div>

      <div class="custom-row">
        <div class="form-group">
          <label for="errorLevel">Correção de Erro</label>
          <select id="errorLevel" class="form-control select-control">
            <option value="1">Baixo (7%) [L]</option>
            <option value="0">Médio (15%) [M]</option>
            <option value="3">Quartil (25%) [Q]</option>
            <option value="2" selected>Alto (30%) [H]</option>
          </select>
        </div>
        <div class="form-group">
          <label for="qrSize">Tamanho (px)</label>
          <select id="qrSize" class="form-control select-control">
            <option value="150">150 x 150</option>
            <option value="200">200 x 200</option>
            <option value="250" selected>250 x 250</option>
            <option value="300">300 x 300</option>
            <option value="400">400 x 400</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Preview panel -->
    <div class="preview-side">
      <div class="qrcode-container-outer" id="qrOuter">
        <div id="qrcode"></div>
      </div>
      <button id="btnDownload" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Baixar Imagem PNG
      </button>
    </div>
  </div>

  <!-- QR Code generation & Hash libraries -->
  <script src="hashids.min.js"></script>
  <script src="qrcode.min.js"></script>
  
  <script>
    const addressInput = document.getElementById('addressInput');
    const colorDarkInput = document.getElementById('colorDark');
    const colorLightInput = document.getElementById('colorLight');
    const errorLevelSelect = document.getElementById('errorLevel');
    const qrSizeSelect = document.getElementById('qrSize');
    const btnDownload = document.getElementById('btnDownload');
    const qrContainer = document.getElementById('qrcode');
    const qrOuter = document.getElementById('qrOuter');

    let qrcodeInstance = null;

    function generateQR() {
      const text = addressInput.value.trim();
      if (!text) {
        qrContainer.innerHTML = '<span style="color: #64748b; font-size: 14px;">Digite algo para gerar...</span>';
        btnDownload.disabled = true;
        qrOuter.style.background = 'rgba(255,255,255,0.05)';
        return;
      }

      btnDownload.disabled = false;
      const size = parseInt(qrSizeSelect.value);
      const colorDark = colorDarkInput.value;
      const colorLight = colorLightInput.value;
      const errorLevel = parseInt(errorLevelSelect.value);

      // Sync outer preview background color with selected QR code background color
      qrOuter.style.background = colorLight;

      qrContainer.innerHTML = ''; // Clear container

      try {
        qrcodeInstance = new QRCode(qrContainer, {
          text: text,
          width: size,
          height: size,
          colorDark: colorDark,
          colorLight: colorLight,
          correctLevel: errorLevel
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Event listeners for real-time update
    addressInput.addEventListener('input', generateQR);
    colorDarkInput.addEventListener('change', generateQR);
    colorLightInput.addEventListener('change', generateQR);
    errorLevelSelect.addEventListener('change', generateQR);
    qrSizeSelect.addEventListener('change', generateQR);

    // Download action
    btnDownload.addEventListener('click', () => {
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');

      if (img && img.src && img.src.startsWith('data:image/')) {
        // Direct download from data URL if image is ready
        triggerDownload(img.src);
      } else if (canvas) {
        // Fallback to canvas
        try {
          const url = canvas.toDataURL('image/png');
          triggerDownload(url);
        } catch (e) {
          console.error("Erro ao obter imagem do canvas:", e);
        }
      } else {
        alert("O QR Code ainda está sendo gerado. Por favor, aguarde.");
      }
    });

    function triggerDownload(dataUrl) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = 'qrcode.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', generateQR);
  </script>
</body>
</html>
